# Codemagic: builds the Enish iOS app and uploads it to TestFlight.
#
# One-time setup in Codemagic (Team settings > Integrations > Developer Portal):
#   add an App Store Connect API key named exactly "Enish App Store Connect".
# Signing certificates and provisioning profiles are created and fetched
# automatically from that key (ios_signing below).

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Enish App Store Connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.enishglobal.enish
      vars:
        BUNDLE_ID: com.enishglobal.enish
        # The app's Apple ID from App Store Connect > App Information.
        APP_STORE_APPLE_ID: "0000000000"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
